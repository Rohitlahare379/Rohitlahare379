name: Update GitHub Profile Analytics & Animated ASCII GIF

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-analytics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Generator Dependencies
        run: npm install --no-save sharp omggif

      - name: Generate Animated ASCII GIF & Analytics SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/generate-ascii-gif.mjs
          node scripts/generate-analytics.mjs

      - name: Commit and Push Updated Assets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'auto: update profile assets & animated GIF [skip ci]'
          file_pattern: 'generated/*'
